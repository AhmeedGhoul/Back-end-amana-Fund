<div class="app-container" [class.sidebar-collapsed]="isCollapsed" [class.mobile-view]="isMobileView">
  <!-- Sidebar Backdrop (for mobile) -->
  <div class="sidebar-backdrop" 
       *ngIf="isMobileView && !isCollapsed" 
       (click)="sidenav.toggle()">
  </div>

  <!-- Sidebar Container -->
  <mat-sidenav-container class="sidenav-container">
    <!-- Sidebar -->
    <mat-sidenav #leftsidenav
                 [mode]="isMobileView ? 'over' : 'side'"
                 [opened]="!isCollapsed"
                 [fixedInViewport]="isMobileView"
                 [fixedTopGap]="0"
                 [fixedBottomGap]="0"
                 (openedChange)="onSidenavOpenedChange($event)"
                 (closedStart)="onSidenavClosedStart()"
                 class="sidebar">
      
      <app-sidebar 
        [isMobileView]="isMobileView"
        [isCollapsed]="isCollapsed"
        (toggleMobileNav)="sidenav.toggle()"
        (toggleCollapsed)="toggleCollapsed()"
        (linkClicked)="onLinkClick()">
      </app-sidebar>
      
    </mat-sidenav>

    <!-- Main Content -->
    <mat-sidenav-content class="main-content">
      <!-- Header -->
      <app-header 
        [isMobileView]="isMobileView"
        [isCollapsed]="isCollapsed"
        (toggleCollapsed)="toggleCollapsed()"
        (toggleMobileNav)="sidenav.toggle()">
      </app-header>

      <!-- Page Content -->
      <main class="page-content">
        <app-loader></app-loader>
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
