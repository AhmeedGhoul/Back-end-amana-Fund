<mat-card>
  <mat-card-content>

    <h2>{{ isEditMode ? 'Edit Fraud Case' : 'Add New Fraud Case' }}</h2>

    <!-- 🆕 Selected Audit Display (both ADD and EDIT mode) -->
    <div *ngIf="selectedAuditToDisplay" class="mb-16">
      <h3>Linked Audit:</h3>
      <mat-card class="p-16" style="background: #f5f5f5;">
        <table mat-table [dataSource]="[selectedAuditToDisplay]" class="mat-elevation-z2 full-width-table small-table">

          <ng-container matColumnDef="dateAudit">
            <th mat-header-cell *matHeaderCellDef>Date Audit</th>
            <td mat-cell *matCellDef="let audit">{{ audit.dateAudit | date:'short' }}</td>
          </ng-container>

          <ng-container matColumnDef="output">
            <th mat-header-cell *matHeaderCellDef>Output</th>
            <td mat-cell *matCellDef="let audit">{{ audit.output }}</td>
          </ng-container>

          <ng-container matColumnDef="statusAudit">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let audit">{{ audit.statusAudit }}</td>
          </ng-container>

          <ng-container matColumnDef="auditType">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let audit">{{ audit.auditType }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['dateAudit', 'output', 'statusAudit', 'auditType']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['dateAudit', 'output', 'statusAudit', 'auditType'];"></tr>

        </table>
      </mat-card>
    </div>

    <!-- 💬 Fraud Case Form -->
    <form [formGroup]="caseForm" (ngSubmit)="submit()" class="d-flex flex-column gap-16">

      <mat-form-field appearance="fill">
        <mat-label>Case Type</mat-label>
        <mat-select formControlName="caseType">
          <mat-option *ngFor="let type of caseTypes" [value]="type">{{ type }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Detection Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="detectionDateTime">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Status</mat-label>
        <mat-select formControlName="caseStatus">
          <mat-option *ngFor="let status of caseStatuses" [value]="status">{{ status }}</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="d-flex justify-between mt-16">
        <button mat-flat-button color="primary" type="submit">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
        <button mat-flat-button color="warn" type="button" (click)="close()">Cancel</button>
      </div>

    </form>

  </mat-card-content>
</mat-card>

<style scoped>
  .gap-16 { gap: 16px; }
  .mt-16 { margin-top: 16px; }
  .mb-16 { margin-bottom: 16px; }
  .d-flex { display: flex; }
  .flex-column { flex-direction: column; }
  .justify-between { justify-content: space-between; }
  .full-width-table { width: 100%; }
  .small-table th, .small-table td { padding: 6px 8px; font-size: 13px; }
</style>
