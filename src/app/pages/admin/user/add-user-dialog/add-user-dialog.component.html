<mat-card class="dialog-card">
  <mat-card-header class="dialog-header">
    <mat-card-title>Add New User</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="userForm" class="form-grid">

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" required>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" *ngIf="!isEditMode">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Phone Number</mat-label>
          <input matInput formControlName="phoneNumber" placeholder="+216XXXXXXXX" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Age</mat-label>
          <input matInput formControlName="age" type="number" required>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Civil Status</mat-label>
          <mat-select formControlName="civilStatus">
            <mat-option value="Single">Single</mat-option>
            <mat-option value="Maried">Maried</mat-option>
            <mat-option value="Widow">Widow</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Date of Birth</mat-label>
          <input matInput formControlName="dateOfBirth" type="date" required>
        </mat-form-field>
      </div>

    </form>
  </mat-card-content>

  <mat-card-actions class="dialog-actions">
    <button mat-flat-button color="primary" (click)="submit()" [disabled]="userForm.invalid">
      <mat-icon>{{ isEditMode ? 'save' : 'person_add' }}</mat-icon>
      &nbsp; {{ isEditMode ? 'Save Changes' : 'Add User' }}
    </button>

    <button mat-stroked-button color="warn" (click)="close()">
      Cancel
    </button>
  </mat-card-actions>
</mat-card>
