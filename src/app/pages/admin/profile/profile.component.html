<div class="profile-container">
  <div class="profile-header">
    <div class="profile-image">
      <img src="/assets/images/profile/user-1.jpg" alt="Profile Image" />
    </div>
    <div class="profile-info">
      <h2>My Profile</h2>
    </div>
  </div>

  <mat-card class="dialog-card" *ngIf="user">
    <mat-card-header class="dialog-header">
      <mat-card-title>Edit Profile</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="editForm" class="form-grid">
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input matInput formControlName="phoneNumber" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Address</mat-label>
            <input matInput formControlName="address" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Date of Birth</mat-label>
            <input matInput formControlName="dateOfBirth" type="date" required>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Age</mat-label>
            <input matInput formControlName="age" type="number" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Civil Status</mat-label>
            <mat-select formControlName="civilStatus">
              <mat-option value="Single">Single</mat-option>
              <mat-option value="Married">Married</mat-option>
              <mat-option value="Widow">Widow</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </form>

      <!-- Face Recognition Section -->
      <div class="m-t-24">
        <button mat-flat-button color="accent" (click)="toggleFaceRegister()">
          <mat-icon>face</mat-icon> Register Face Recognition
        </button>
      </div>

      <div *ngIf="showFaceRegister" class="m-t-16 text-center">
        <webcam [trigger]="triggerObservable" (imageCapture)="registerFaceImage($event)"></webcam>
        <div class="m-t-12">
          <button mat-stroked-button color="warn" (click)="cancelFaceRegister()">Cancel</button>
          <button mat-flat-button color="primary" (click)="captureFace()">
            <mat-icon>photo_camera</mat-icon> Capture
          </button>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions class="dialog-actions">
      <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="editForm.invalid">
        <mat-icon>save</mat-icon>&nbsp; Save Changes
      </button>
      <button mat-stroked-button color="warn">Cancel</button>
    </mat-card-actions>
  </mat-card>

  <div class="password-section">
    <button *ngIf="!isPasswordEditing" (click)="togglePasswordEditing()" class="edit-button">
      Modify Password
    </button>

    <div *ngIf="isPasswordEditing">
      <form (ngSubmit)="changePassword()">
        <div class="form-row">
          <label for="oldPassword">Old Password</label>
          <input type="password" id="oldPassword" [(ngModel)]="oldPassword" name="oldPassword" required />
        </div>

        <div class="form-row">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" required />
        </div>

        <div class="form-row">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required />
        </div>

        <button type="submit" class="save-button">Save Password</button>
        <button type="button" (click)="togglePasswordEditing()" class="cancel-button">Cancel</button>
      </form>
    </div>
  </div>
</div>
