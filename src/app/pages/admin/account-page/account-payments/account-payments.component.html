<div class="page-container">
  <div class="header-section">
    <div class="d-flex justify-content-between align-items-center">
      <div class="header-content">
        <h1>Account Payments</h1>
        <p class="text-muted">Manage and monitor all payment transactions</p>
      </div>
      <div class="header-actions">
        <button mat-stroked-button (click)="goBack()" class="back-button">
          <mat-icon>arrow_back</mat-icon>
          Back to Accounts
        </button>
        <button mat-raised-button color="primary" (click)="openAddDialog()" class="add-button">
          <mat-icon>add</mat-icon>
          Add Payment
        </button>
      </div>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-header">
      <h2>Filter Payments</h2>
      <button mat-button color="primary" (click)="resetFilters()" class="reset-button">
        <mat-icon>refresh</mat-icon>
        Reset Filters
      </button>
    </div>
    <form [formGroup]="filterForm" (ngSubmit)="applyFilters()">
      <div class="filter-row">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Agency Name</mat-label>
          <input matInput formControlName="agencyName" placeholder="Enter agency name">
          <mat-icon matPrefix>business</mat-icon>
          <button mat-icon-button matSuffix *ngIf="filterForm.get('agencyName')?.value" (click)="clearField('agencyName')">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>

        <div class="date-range">
          <mat-form-field appearance="outline" class="date-field">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="date-field">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <div class="filter-actions">
          <button mat-stroked-button type="button" (click)="resetFilters()" class="clear-button">
            <mat-icon>clear</mat-icon>
            Clear
          </button>
          <button mat-raised-button color="primary" type="submit" class="filter-button">
            <mat-icon>search</mat-icon>
            Apply Filters
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let payment">{{payment.id}}</td>
      </ng-container>

      <ng-container matColumnDef="paymentDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Payment Date</th>
        <td mat-cell *matCellDef="let payment">{{payment.paymentDate | date}}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
        <td mat-cell *matCellDef="let payment">{{payment.amount | currency}}</td>
      </ng-container>

      <ng-container matColumnDef="agencyName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Agency Name</th>
        <td mat-cell *matCellDef="let payment">{{payment.agencyName}}</td>
      </ng-container>

      <ng-container matColumnDef="rib">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>RIB</th>
        <td mat-cell *matCellDef="let payment">{{payment.rib}}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let payment">
          <button mat-icon-button color="primary" (click)="openEditDialog(payment)" class="action-button">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletePayment(payment)" class="action-button">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</div>
