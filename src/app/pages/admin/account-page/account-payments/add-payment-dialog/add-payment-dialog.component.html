<h2 mat-dialog-title>Add New Payment</h2>

<mat-dialog-content>
  <form [formGroup]="paymentForm" class="payment-form">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Agency Name</mat-label>
        <input matInput formControlName="agencyName" placeholder="Enter agency name">
        <mat-icon matPrefix>business</mat-icon>
        <mat-error *ngIf="paymentForm.get('agencyName')?.hasError('required')">
          Agency name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>RIB</mat-label>
        <input matInput formControlName="rib" placeholder="Enter RIB">
        <mat-icon matPrefix>account_balance</mat-icon>
        <mat-error *ngIf="paymentForm.get('rib')?.hasError('required')">
          RIB is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Amount</mat-label>
        <input matInput type="number" formControlName="amount" placeholder="Enter amount">
        <mat-icon matPrefix>attach_money</mat-icon>
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('required')">
          Amount is required
        </mat-error>
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('min')">
          Amount must be greater than 0
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Payment Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="paymentDate">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-icon matPrefix>calendar_today</mat-icon>
        <mat-error *ngIf="paymentForm.get('paymentDate')?.hasError('required')">
          Payment date is required
        </mat-error>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!paymentForm.valid">
    <mat-icon>save</mat-icon>
    Save Payment
  </button>
</mat-dialog-actions>
