<h2 mat-dialog-title class="dialog-title">Edit Payment</h2>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="paymentForm" class="payment-form">
    <div class="form-section">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Payment Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="paymentDate" required>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-icon matPrefix>event</mat-icon>
        <mat-error *ngIf="paymentForm.get('paymentDate')?.hasError('required')">
          Payment date is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Amount</mat-label>
        <input matInput type="number" formControlName="amount" required>
        <mat-icon matPrefix>attach_money</mat-icon>
        <span matSuffix>TND</span>
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('required')">
          Amount is required
        </mat-error>
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('min')">
          Amount must be greater than 0
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-section">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Agency Name</mat-label>
        <input matInput formControlName="agencyName" required>
        <mat-icon matPrefix>business</mat-icon>
        <mat-error *ngIf="paymentForm.get('agencyName')?.hasError('required')">
          Agency name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>RIB</mat-label>
        <input matInput formControlName="rib" required>
        <mat-icon matPrefix>credit_card</mat-icon>
        <mat-error *ngIf="paymentForm.get('rib')?.hasError('required')">
          RIB is required
        </mat-error>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button mat-dialog-close class="cancel-button">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" 
          [disabled]="!paymentForm.valid" class="submit-button">
    Update Payment
  </button>
</mat-dialog-actions>
