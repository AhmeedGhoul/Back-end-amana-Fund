<div class="chart-card">
  <div class="chart-header">
    <span class="chart-title">Balance Trend</span>
    <span class="period-indicator">{{ periodType | titlecase }}</span>
  </div>
  <div *ngIf="loading" class="chart-loading">
    <mat-spinner diameter="50" color="accent"></mat-spinner>
  </div>
  <div *ngIf="!loading" class="chart-content">
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
    <div class="chart-area" *ngIf="!errorMessage">
      <canvas baseChart
        [data]="statsChartData"
        [options]="statsChartOptions"
        [type]="'line'"
        style="display: block; height: 100%; width: 100%;">
      </canvas>
    </div>
  </div>
</div>
