<div class="account-full-details-container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
  <mat-card class="details-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>account_balance</mat-icon>
        Account Full Details
      </mat-card-title>
      <mat-card-subtitle *ngIf="account">RIB: {{ account?.rib }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="loading" class="loading-container">
        <mat-spinner></mat-spinner>
        <p>Loading account details...</p>
      </div>

      <div *ngIf="!loading" class="details-grid">
        <div *ngFor="let detail of accountDetails" class="detail-item">
          <div class="detail-label">{{ detail.attribute }}</div>
          <div class="detail-value">
            <ng-container *ngIf="!isEditMode || !isEditableField(detail.attribute)">
              {{ detail.value }}
            </ng-container>
            <ng-container *ngIf="isEditMode && isEditableField(detail.attribute)">
              <input 
                *ngIf="detail.attribute === 'Amount'"
                [(ngModel)]="editableAccount.amount" name="amount"
                type="number"
                class="edit-input"
              >
            <input 
                *ngIf="detail.attribute === 'Client Email'"
                [(ngModel)]="editableAccount.clientEmail" name="clientEmail"
                type="email"
                class="edit-input"
              >

            </ng-container>
          </div>
        </div>
      </div>

      <!-- Account Payments Section -->
      <div class="payments-section" *ngIf="accountPayments.length > 0">
        <h3>Account Payments</h3>
        <table mat-table [dataSource]="accountPayments" class="payments-table">
      <!-- Payment Date Column -->
      <ng-container matColumnDef="paymentDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let payment">
          {{ payment.paymentDate | date:'medium' }}
        </td>
      </ng-container>

      <!-- Amount Column -->
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let payment">
          {{ payment.amount | number:'1.2-2' }} TND
        </td>
      </ng-container>

      <!-- Agency Name Column -->
      <ng-container matColumnDef="agencyName">
        <th mat-header-cell *matHeaderCellDef>Agency</th>
        <td mat-cell *matCellDef="let payment">
          {{ payment.agencyName }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-stroked-button color="primary" routerLink="/admin/account">
        <mat-icon>arrow_back</mat-icon>
        Back to Accounts
      </button>
      <button 
        *ngIf="!isEditMode" 
        mat-raised-button 
        color="accent" 
        (click)="toggleEditMode()"
      >
        <mat-icon>edit</mat-icon>
        Edit Account
      </button>
      <button mat-raised-button class="create-payment-btn" (click)="openPaymentDialog()">
        <mat-icon>add_circle_outline</mat-icon>
        Create Payment
      </button>
      <ng-container *ngIf="isEditMode">
        <button 
          mat-raised-button 
          color="primary" 
          (click)="saveAccountChanges()"
        >
          <mat-icon>save</mat-icon>
          Save Changes
        </button>
        <button 
          mat-stroked-button 
          color="warn" 
          (click)="cancelEditMode()"
        >
          <mat-icon>cancel</mat-icon>
          Cancel
        </button>
      </ng-container>
    </mat-card-actions>
  </mat-card>
</div>
