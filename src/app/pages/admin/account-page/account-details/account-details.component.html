<div class="account-details-container">
  <div class="header-section">
    <div class="title-section">
      <h1 class="page-title">Account Management</h1>
      <p class="page-subtitle">Manage and monitor all bank accounts</p>
    </div>
    
    <div class="action-buttons">
      <button mat-raised-button color="primary" class="action-button" (click)="addAccount()">
        <mat-icon>add</mat-icon>
        Add New Account
      </button>

      <button mat-raised-button color="accent" class="action-button export-button" (click)="exportToExcel()">
        <div class="button-content">
          <mat-icon class="button-icon">download</mat-icon>
          <span class="button-text">Export to Excel</span>
        </div>
      </button>
      
      <app-account-actions 
        [accountId]="selectedAccount?.id ?? null">
      </app-account-actions>
    </div>
  </div>


  <mat-card class="main-card">
    <div class="filter-section">
      <div class="filter-container">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Account Type</mat-label>
          <mat-select [(ngModel)]="selectedType" (selectionChange)="applyFilters()">
            <mat-option [value]="null">All Types</mat-option>
            <mat-option *ngFor="let type of accountTypes" [value]="type">
              {{type}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="search-field" [class.mat-form-field-invalid]="ribError">
          <mat-label>Search by RIB</mat-label>
          <input matInput 
            [(ngModel)]="searchTerm" 
            (input)="validateRib()"
            (keyup.enter)="loadAccounts()"
            placeholder="Enter RIB (e.g., TN000000001312374017)"
            required
            pattern="^TN\d{15}$">
          <mat-icon matSuffix (click)="loadAccounts()">search</mat-icon>
          <mat-error *ngIf="ribError">{{ ribErrorMessage }}</mat-error>
        </mat-form-field>
      </div>
    </div>

    <app-accounts-table
      [dataSource]="dataSource"
      [displayedColumns]="displayedColumns"
      [ribError]="ribError"
      [ribErrorMessage]="ribErrorMessage"
      [totalElements]="totalElements"
      [pageSizeOptions]="pageSizeOptions"
      [paginator]="paginator"
      [sort]="sort"
      (openAccountDetails)="openAccountDetails($event)"
      (resetSearch)="resetSearch()"
    ></app-accounts-table>

    <mat-paginator
      [pageSizeOptions]="pageSizeOptions"
      [length]="totalElements"
      showFirstLastButtons
      aria-label="Select page of account records">
    </mat-paginator>
  </mat-card>
</div>
