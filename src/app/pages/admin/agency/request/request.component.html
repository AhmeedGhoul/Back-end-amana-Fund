<mat-card class="cardWithShadow">
  <mat-card-content class="p-24">
    <!-- Header + Report Button -->
    <div class="d-flex w-100 align-center mb-24">
      <mat-card-title>Request Management</mat-card-title>
      <div class="m-l-auto">
        <button mat-flat-button color="primary" (click)="openAddRequestDialog()">
          <mat-icon>add</mat-icon> Add Request
        </button>
      </div>
    </div>

    <!-- Filter Toolbar -->
    <div class="filter-bar d-flex gap-16 mb-24 flex-wrap">
      <mat-form-field appearance="outline" class="flex-grow-1">
        <mat-label>Search Product</mat-label>
        <input matInput [(ngModel)]="filters.product" (ngModelChange)="applyFilters()" placeholder="Product..." />
      </mat-form-field>
    </div>

    <!-- Logs Table -->
    <div class="table-container mb-24">
      <table mat-table [dataSource]="requests" class="mat-elevation-z8 full-width-table">
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let request">{{ request.product }}</td>
        </ng-container>

        <ng-container matColumnDef="document">
          <th mat-header-cell *matHeaderCellDef>Document</th>
          <td mat-cell *matCellDef="let request">{{ request.document }}</td>
        </ng-container>

        <ng-container matColumnDef="dateRequest">
          <th mat-header-cell *matHeaderCellDef>Request Date</th>
          <td mat-cell *matCellDef="let request">
            {{ request.date_Request | date:'medium' || 'N/A' }} <!-- Display formatted date -->
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="centered">Actions</th>
          <td mat-cell *matCellDef="let request" class="centered">
            <button mat-icon-button color="primary" (click)="editRequest(request)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteRequest(request)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-controls d-flex justify-between align-center">
      <button mat-stroked-button (click)="pageChanged(currentPage - 1)" [disabled]="currentPage === 0">Previous</button>
      <span class="page-info">Page {{ currentPage + 1 }}</span>
      <button mat-stroked-button (click)="pageChanged(currentPage + 1)" [disabled]="(currentPage + 1) * pageSize >= totalRequests">Next</button>
    </div>
  </mat-card-content>
</mat-card>
