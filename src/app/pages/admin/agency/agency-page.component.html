<div class="page-container p-24 d-flex flex-column gap-24">
  <!-- Agency Section -->
  <div class="section">
    <app-agency (selectionChanged)="onAgencySelectionChanged($event)"></app-agency>
  </div>

  <!-- Request Section -->
  <div class="section">
    <app-request
      [selectedAgency]="selectedAgency"
      (requestSelected)="onRequestSelectionChanged($event)">
    </app-request>
  </div>

  <!-- Additional Info Section based on selection -->
  <div class="section">
    <div *ngIf="selectedAgency">
      <p>Agency Details: {{ selectedAgency | json }}</p>
    </div>
    <div *ngIf="selectedRequest">
      <p>Request Details: {{ selectedRequest | json }}</p>
    </div>
  </div>
</div>
