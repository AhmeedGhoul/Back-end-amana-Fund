<mat-card class="cardWithShadow">
  <mat-card-content class="p-24">

    <div class="d-flex w-100 align-center mb-24">
      <mat-card-title>Agency Management</mat-card-title>
      <div class="m-l-auto">
        <button mat-flat-button color="primary" (click)="openAddAgencyDialog()">
          <mat-icon>add</mat-icon> Add Agency
        </button>
      </div>
    </div>

    <div class="filter-bar d-flex gap-16 mb-24 flex-wrap">
      <mat-form-field appearance="outline" class="flex-grow-1">
        <mat-label>Search Address</mat-label>
        <input matInput [(ngModel)]="filters.address" (ngModelChange)="applyFilters()" placeholder="Address..." />
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-grow-1">
        <mat-label>Search City</mat-label>
        <input matInput [(ngModel)]="filters.city" (ngModelChange)="applyFilters()" placeholder="City..." />
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-grow-1">
        <mat-label>Search Phone</mat-label>
        <input matInput [(ngModel)]="filters.phoneNumber" (ngModelChange)="applyFilters()" placeholder="Phone..." />
      </mat-form-field>

      <mat-form-field appearance="outline" class="flex-grow-1">
        <mat-label>Search Email</mat-label>
        <input matInput [(ngModel)]="filters.email" (ngModelChange)="applyFilters()" placeholder="Email..." />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Governorate</mat-label>
        <mat-select [(ngModel)]="filters.governorate" (ngModelChange)="applyFilters()">
          <mat-option *ngFor="let governorate of governorates" [value]="governorate">{{ governorate }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-flat-button color="accent" (click)="generateReport()">
        <mat-icon>download</mat-icon> Report
      </button>
    </div>

    <div class="table-container mb-24">
      <table mat-table [dataSource]="agencies" class="mat-elevation-z8 full-width-table">

        <ng-container matColumnDef="governorate">
          <th mat-header-cell *matHeaderCellDef>Governorate</th>
          <td mat-cell *matCellDef="let agency">{{ agency.governorate }}</td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let agency">{{ agency.address }}</td>
        </ng-container>

        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef>City</th>
          <td mat-cell *matCellDef="let agency">{{ agency.city }}</td>
        </ng-container>

        <ng-container matColumnDef="phoneNumber">
          <th mat-header-cell *matHeaderCellDef>Phone Number</th>
          <td mat-cell *matCellDef="let agency">{{ agency.phoneNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let agency">{{ agency.email }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="centered">Actions</th>
          <td mat-cell *matCellDef="let agency" class="centered">
            <button mat-icon-button color="primary" (click)="editAgency(agency)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteAgency(agency)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>

    <div class="pagination-controls d-flex justify-between align-center">
      <button mat-stroked-button (click)="pageChanged(currentPage - 1)" [disabled]="currentPage === 0">Previous</button>
      <span class="page-info">Page {{ currentPage + 1 }}</span>
      <button mat-stroked-button (click)="pageChanged(currentPage + 1)" [disabled]="(currentPage + 1) * pageSize >= totalAgencies">Next</button>
    </div>

  </mat-card-content>
</mat-card>
