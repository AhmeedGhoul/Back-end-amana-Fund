<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth" style="width: 100%; max-width: 640px;">
      <mat-card-content class="p-32 text-center">

          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img src="../../../../../assets/images/logos/dark-logo.svg" class="align-middle m-2" alt="logo" />
            </a>
          </div>

          <h2 class="m-t-24 mb-4">Face Recognition Login</h2>

          <div class="text-danger mb-2" *ngIf="errorMessage">{{ errorMessage }}</div>

        <div class="webcam-wrapper">
          <webcam [trigger]="triggerObservable" (imageCapture)="handleImage($event)"></webcam>
        </div>
          <div class="m-t-12">
            <button mat-stroked-button color="warn" class="m-r-2" (click)="cancel()">
              Cancel
            </button>
            <button mat-flat-button color="primary" (click)="capture()">
              <mat-icon>photo_camera</mat-icon>&nbsp; Capture
            </button>
          </div>

        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
