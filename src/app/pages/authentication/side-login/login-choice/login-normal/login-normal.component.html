<div class="modern-login-container">
  <div class="animated-background">
    <!-- Floating shapes for gradient effect -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    
    <!-- Floating money symbols with better spacing -->
    <div class="money-symbol" style="left: 12%; top: 18%; font-size: 70px; animation-delay: 0s;">$</div>
    <div class="money-symbol" style="right: 18%; top: 68%; font-size: 85px; animation-delay: 3s;">€</div>
    <div class="money-symbol" style="left: 28%; bottom: 22%; font-size: 65px; animation-delay: 6s;">£</div>
    <div class="money-symbol" style="right: 22%; top: 22%; font-size: 75px; animation-delay: 9s;">¥</div>
    
    <!-- Financial icons with improved spacing -->
    <div class="financial-icon credit-card-icon" style="right: 12%; top: 12%; transform: rotate(10deg); animation-delay: 2s;"></div>
    <div class="financial-icon coin-stack-icon" style="left: 8%; bottom: 28%; animation-delay: 5s;"></div>
    <div class="financial-icon chart-icon" style="right: 15%; bottom: 32%; transform: rotate(-5deg); animation-delay: 8s;"></div>
    <div class="financial-icon bank-icon" style="left: 18%; top: 65%; transform: rotate(-8deg); animation-delay: 11s;"></div>
    <div class="financial-icon wallet-icon" style="right: 28%; top: 42%; animation-delay: 7s;"></div>
    <div class="financial-icon safe-icon" style="left: 65%; top: 15%; transform: rotate(5deg); animation-delay: 10s;"></div>
  </div>
  
  <div class="login-content-wrapper">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img src="../../assets/images/Front/logo.png" alt="logo" style="width: 240px; height: auto;"  class="align-middle" />
            </a>
          </div>



          <form [formGroup]="form" (ngSubmit)="submit()">
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="uname" />
            </mat-form-field>

            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput type="password" formControlName="password" />
            </mat-form-field>
            <mat-checkbox  name="rememberMe" class="m-t-12">
              Remember me
            </mat-checkbox>

            <div class="text-center m-t-12">
              <a href="javascript:void(0)" (click)="forgotPassword()">Forgot Password?</a>
            </div>
            <div *ngIf="errorMessage" class="text-danger m-b-12">{{ errorMessage }}</div>
            <div class="recaptcha-wrapper">
              <re-captcha
                siteKey="6Lcc6ysrAAAAAPqPZRYF8vypm3Ig8dVTGR7-XUEo"
                (resolved)="onCaptchaResolved($event)">
              </re-captcha>
            </div>
            <button mat-flat-button color="primary" class="w-100" type="submit" [disabled]="form.invalid || !captchaResponse">
              Sign In
            </button>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
</div>
